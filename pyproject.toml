[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "A general-purpose multi-agent orchestration system built on the Claude Agent SDK."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "click>=8.1",
]

[project.scripts]
agentos = "agentos.cli:cli"

[tool.setuptools.packages.find]
include = ["agentos*"]
